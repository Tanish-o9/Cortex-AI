name: Cortex AI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Root Workspace Dependencies
      run: npm install

    - name: Run Workspace Audits & Lints
      run: |
        npm run lint --if-present

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & Push Gateway Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend/gateway
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/cortex-gateway:latest

    - name: Build & Push Auth Service Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend/services/auth
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/cortex-auth-service:latest

    - name: Build & Push Agent Service Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend/services/agent
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/cortex-agent-service:latest
